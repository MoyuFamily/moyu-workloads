# Instance parameters only. Publish and verify an Artifact before adding its
# URL and expectedFingerprint to Fleet. Set memoryMiB/taskRequirement from
# measured production resource usage before deployment.
startupGraceSeconds: 2
healthTimeoutSeconds: 20
listenPorts: [3100]
env:
  PORT: "3100"
  TC_STORAGE_PATH: "${MOYU_WORKLOAD_ROOT}/data/store.sqlite"
  CPA_BASE_URL: https://cpa.moyuday.com/v1
  CPA_MODEL: gpt-5.6-terra
  CPA_REASONING_EFFORT: low
  CPA_SERVICE_TIER: priority
envRefs:
  CPA_API_KEY: teacher-cpa-api-key
  ADMIN_TOKEN: teacher-admin-token
expose:
  - name: web
    protocol: http
    localPort: 3100
    publicHost: teacher.example.com
    transport: cloudflare-tunnel
    access: public
    healthPath: /api/health
